naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — Query
  description: 'Salesforce REST API — Query. 2 operations. Lead operation: Execute SOQL Query. Self-contained Naftiko capability
    covering one Salesforcecom business surface.'
  tags:
  - Salesforcecom
  - Query
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCECOM_API_KEY: SALESFORCECOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-query
    baseUri: https://{instance}.salesforce.com
    description: Salesforce REST API — Query business capability. Self-contained, no shared references.
    resources:
    - name: services-data-v{version}-query
      path: /services/data/v{version}/query
      operations:
      - name: executequery
        method: GET
        description: Execute SOQL Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: version
          in: path
          type: string
          description: Salesforce API version
          required: true
        - name: q
          in: query
          type: string
          description: SOQL query string (e.g., SELECT Id, Name FROM Account LIMIT 200)
          required: true
    - name: services-data-v{version}-queryAll
      path: /services/data/v{version}/queryAll
      operations:
      - name: executequeryall
        method: GET
        description: Execute SOQL Query Including Deleted Records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: version
          in: path
          type: string
          description: Salesforce API version
          required: true
        - name: q
          in: query
          type: string
          description: SOQL query string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCECOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-query-rest
    port: 8080
    description: REST adapter for Salesforce REST API — Query. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/services/data/v-version/query
      name: services-data-v-version-query
      description: REST surface for services-data-v{version}-query.
      operations:
      - method: GET
        name: executequery
        description: Execute SOQL Query
        call: rest-query.executequery
        with:
          version: rest.version
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/data/v-version/queryall
      name: services-data-v-version-queryall
      description: REST surface for services-data-v{version}-queryAll.
      operations:
      - method: GET
        name: executequeryall
        description: Execute SOQL Query Including Deleted Records
        call: rest-query.executequeryall
        with:
          version: rest.version
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-query-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — Query. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: execute-soql-query
      description: Execute SOQL Query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-query.executequery
      with:
        version: tools.version
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
    - name: execute-soql-query-including-deleted
      description: Execute SOQL Query Including Deleted Records
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-query.executequeryall
      with:
        version: tools.version
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
