naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — Search
  description: 'Salesforce REST API — Search. 1 operations. Lead operation: Execute SOSL Search. Self-contained Naftiko capability
    covering one Salesforcecom business surface.'
  tags:
  - Salesforcecom
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCECOM_API_KEY: SALESFORCECOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-search
    baseUri: https://{instance}.salesforce.com
    description: Salesforce REST API — Search business capability. Self-contained, no shared references.
    resources:
    - name: services-data-v{version}-search
      path: /services/data/v{version}/search
      operations:
      - name: executesearch
        method: GET
        description: Execute SOSL Search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: version
          in: path
          type: string
          description: Salesforce API version
          required: true
        - name: q
          in: query
          type: string
          description: SOSL search string (e.g., FIND {Joe Smith} IN ALL FIELDS RETURNING Account, Contact)
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCECOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-search-rest
    port: 8080
    description: REST adapter for Salesforce REST API — Search. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/services/data/v-version/search
      name: services-data-v-version-search
      description: REST surface for services-data-v{version}-search.
      operations:
      - method: GET
        name: executesearch
        description: Execute SOSL Search
        call: rest-search.executesearch
        with:
          version: rest.version
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — Search. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: execute-sosl-search
      description: Execute SOSL Search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-search.executesearch
      with:
        version: tools.version
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
