naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — Composite
  description: 'Salesforce REST API — Composite. 2 operations. Lead operation: Execute Composite Request. Self-contained Naftiko
    capability covering one Salesforcecom business surface.'
  tags:
  - Salesforcecom
  - Composite
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCECOM_API_KEY: SALESFORCECOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-composite
    baseUri: https://{instance}.salesforce.com
    description: Salesforce REST API — Composite business capability. Self-contained, no shared references.
    resources:
    - name: services-data-v{version}-composite
      path: /services/data/v{version}/composite
      operations:
      - name: compositerequest
        method: POST
        description: Execute Composite Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: version
          in: path
          type: string
          description: Salesforce API version
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: services-data-v{version}-composite-batch
      path: /services/data/v{version}/composite/batch
      operations:
      - name: compositebatch
        method: POST
        description: Execute Composite Batch
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: version
          in: path
          type: string
          description: Salesforce API version
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCECOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-composite-rest
    port: 8080
    description: REST adapter for Salesforce REST API — Composite. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/services/data/v-version/composite
      name: services-data-v-version-composite
      description: REST surface for services-data-v{version}-composite.
      operations:
      - method: POST
        name: compositerequest
        description: Execute Composite Request
        call: rest-composite.compositerequest
        with:
          version: rest.version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/data/v-version/composite/batch
      name: services-data-v-version-composite-batch
      description: REST surface for services-data-v{version}-composite-batch.
      operations:
      - method: POST
        name: compositebatch
        description: Execute Composite Batch
        call: rest-composite.compositebatch
        with:
          version: rest.version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-composite-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — Composite. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: execute-composite-request
      description: Execute Composite Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-composite.compositerequest
      with:
        version: tools.version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: execute-composite-batch
      description: Execute Composite Batch
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-composite.compositebatch
      with:
        version: tools.version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
