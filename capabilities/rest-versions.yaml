naftiko: 1.0.0-alpha2
info:
  label: Salesforce REST API — Versions
  description: 'Salesforce REST API — Versions. 1 operations. Lead operation: List Available API Versions. Self-contained
    Naftiko capability covering one Salesforcecom business surface.'
  tags:
  - Salesforcecom
  - Versions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCECOM_API_KEY: SALESFORCECOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-versions
    baseUri: https://{instance}.salesforce.com
    description: Salesforce REST API — Versions business capability. Self-contained, no shared references.
    resources:
    - name: services-data
      path: /services/data
      operations:
      - name: listapiversions
        method: GET
        description: List Available API Versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCECOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-versions-rest
    port: 8080
    description: REST adapter for Salesforce REST API — Versions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/services/data
      name: services-data
      description: REST surface for services-data.
      operations:
      - method: GET
        name: listapiversions
        description: List Available API Versions
        call: rest-versions.listapiversions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-versions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce REST API — Versions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-available-api-versions
      description: List Available API Versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-versions.listapiversions
      outputParameters:
      - type: object
        mapping: $.
