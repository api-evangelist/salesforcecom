description: Plans/pricing artifact for Salesforce. Trimmed to a single Contact Sales entry pending manual
  reconciliation. Salesforce publishes per-edition pricing on its product pages, but those pages are not
  retrievable via automated fetch (HTTP 403). All editions are sold via Salesforce Sales; API access is
  included with the underlying CRM license rather than priced as a discrete API SKU. Treat this artifact
  as a contact-sales placeholder until pricing pages can be reconciled manually.
sources:
- https://www.salesforce.com/pricing/
